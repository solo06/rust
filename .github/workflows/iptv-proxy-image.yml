name: Build IPTV Proxy Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'IPTV Proxy/**'
      - '.github/workflows/iptv-proxy-image.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: iptv-proxy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE }}
          # 关掉 metadata-action 的 latest=auto：否则推任何 tag 都会覆盖 latest，
          # 以后补推一个旧版本 tag 会让 latest 回退
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: "IPTV Proxy"
          # 只保留 amd64 与 arm64：arm/v7 要 QEMU 模拟，构建慢且这台设备用不到
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
